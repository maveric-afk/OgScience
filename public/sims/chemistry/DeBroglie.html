<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>De Broglie Hypothesis · OgScience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#080808; --text:#e8e8e8; --muted:rgba(255,255,255,.45); --line:rgba(255,255,255,.10); --glass:rgba(255,255,255,.04); --blue:#6fa0ff; --red:#ff6b6b; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; touch-action:manipulation; }
  canvas#C { position:fixed; inset:0; display:block; }
  .noise { position:fixed; inset:0; pointer-events:none; z-index:5; opacity:.035; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .vignette { position:fixed; inset:0; pointer-events:none; z-index:4; background:radial-gradient(ellipse 80% 70% at 42% 48%, transparent 45%, rgba(0,0,0,.6) 100%); }
  .glass { background:var(--glass); border:1px solid var(--line); border-radius:20px; backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); }
  .syne { font-family:'Syne',sans-serif; }

  /* top bar */
  #topbar { position:fixed; top:0; left:0; right:0; height:68px; z-index:20; padding:0 clamp(16px,3vw,40px); display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
  #topbar > * { pointer-events:auto; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; }
  .brand .dot { width:32px; height:32px; border-radius:50%; background:#fff; color:#080808; display:grid; place-items:center; font-family:'Syne'; font-weight:800; font-size:14px; }
  .brand span { font-family:'Syne'; font-weight:700; font-size:16px; letter-spacing:-.01em; }
  .back { font-family:'Syne'; font-weight:600; font-size:13px; letter-spacing:.04em; color:var(--text); text-decoration:none; padding:10px 22px; border:1px solid rgba(255,255,255,.2); border-radius:100px; transition:all .3s; }
  .back:hover { border-color:rgba(255,255,255,.6); background:rgba(255,255,255,.06); }

  /* title card */
  #title { position:fixed; left:clamp(16px,3vw,40px); top:88px; z-index:10; max-width:330px; padding:22px 24px; }
  .tag { display:inline-block; font-size:11px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:#999; padding:6px 14px; border:1px solid var(--line); border-radius:100px; margin-bottom:14px; }
  #title h1 { font-family:'Syne'; font-weight:800; font-size:clamp(22px,2.4vw,32px); line-height:1.05; letter-spacing:-.025em; margin-bottom:10px; }
  .grad { background:linear-gradient(135deg,#fff 0%,#8a8a8a 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  #title p { font-size:13px; line-height:1.7; color:var(--muted); }
  #title p b { color:#fff; font-weight:500; }

  /* right panel */
  #panel { position:fixed; right:clamp(16px,3vw,40px); top:88px; width:300px; z-index:10; padding:22px; }
  .cap { font-family:'Syne'; font-weight:700; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  #nbtns { display:flex; gap:8px; margin-bottom:20px; }
  .nb { flex:1; aspect-ratio:1; border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.02); color:rgba(255,255,255,.55); font-family:'Syne'; font-weight:700; font-size:16px; cursor:pointer; transition:all .3s cubic-bezier(.16,1,.3,1); }
  .nb:hover { border-color:rgba(255,255,255,.4); color:#fff; transform:translateY(-2px); }
  .nb.active { background:#fff; color:#080808; border-color:#fff; box-shadow:0 0 24px rgba(255,255,255,.25); }
  #eq { font-family:'Syne'; font-weight:800; font-size:30px; letter-spacing:-.02em; text-align:center; margin-bottom:10px; }
  #eq em { font-style:normal; color:var(--blue); }
  .verdict { text-align:center; font-size:12px; font-weight:500; letter-spacing:.04em; padding:7px 12px; border-radius:100px; margin:0 auto 16px; width:fit-content; border:1px solid; transition:all .3s; }
  .verdict.ok { color:var(--blue); border-color:rgba(111,160,255,.35); background:rgba(111,160,255,.08); }
  .verdict.bad { color:var(--red); border-color:rgba(255,107,107,.4); background:rgba(255,107,107,.08); }
  #strip { width:100%; height:84px; display:block; border-radius:12px; background:rgba(255,255,255,.02); border:1px solid var(--line); margin-bottom:16px; }
  .stat { display:flex; justify-content:space-between; font-size:12px; margin-bottom:9px; }
  .stat span:first-child { color:var(--muted); }
  .stat span:last-child { font-family:'Syne'; font-weight:700; color:#fff; }
  #fact { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; line-height:1.7; color:var(--muted); }

  /* bottom bar */
  #bar { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:15; display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:100px; max-width:calc(100% - 24px); flex-wrap:nowrap; }
  .pill { padding:11px 22px; border-radius:100px; border:1px solid rgba(255,255,255,.2); background:transparent; color:var(--text); font-family:'Syne'; font-weight:600; font-size:13px; letter-spacing:.03em; cursor:pointer; transition:all .25s; white-space:nowrap; }
  .pill:hover { border-color:rgba(255,255,255,.6); background:rgba(255,255,255,.06); }
  .pill.primary { background:#fff; color:#080808; border-color:#fff; }
  .pill.primary:hover { box-shadow:0 8px 28px rgba(255,255,255,.2); }
  .pill.on { background:rgba(111,160,255,.14); border-color:var(--blue); color:var(--blue); }
  .speed { display:flex; align-items:center; gap:10px; padding:0 8px; font-size:12px; color:var(--muted); }
  .speed b { font-family:'Syne'; color:#fff; min-width:14px; text-align:center; }
  input[type=range] { -webkit-appearance:none; appearance:none; height:2px; background:rgba(255,255,255,.2); border-radius:2px; outline:none; width:96px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 0 12px rgba(255,255,255,.5); border:none; }
  input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#fff; border:none; box-shadow:0 0 12px rgba(255,255,255,.5); }

  /* test-wavelength box */
  #testbox { position:fixed; bottom:92px; left:50%; transform:translateX(-50%); z-index:15; padding:14px 22px; display:none; align-items:center; gap:16px; border-radius:100px; font-size:12px; color:var(--muted); white-space:nowrap; }
  #testbox.show { display:flex; }
  #testbox input { width:200px; }
  #testbox b { font-family:'Syne'; color:#fff; min-width:70px; text-align:left; }

  @media (max-width:860px) {
    #title { display:none; }
    #panel { top:auto; bottom:92px; left:12px; right:12px; width:auto; padding:14px 16px; }
    #strip, #fact, .stat, #eq { display:none; }
    #nbtns { margin-bottom:12px; } .nb { max-width:52px; }
    .verdict { margin-bottom:0; }
    #bar { gap:6px; padding:8px 10px; } .pill { padding:10px 14px; font-size:12px; } .speed span.l { display:none; } input[type=range] { width:64px; }
    #testbox { bottom:215px; padding:10px 16px; } #testbox input { width:130px; }
  }
</style>
</head>
<body>

<canvas id="C"></canvas>
<div class="vignette"></div><div class="noise"></div>

<div id="topbar">
  <a class="brand" href="/"><div class="dot">O</div><span>OgScience</span></a>
  <a class="back" href="/simulations">← Simulations</a>
</div>


<div id="panel" class="glass">
  <div class="cap">Choose Orbit (n)</div>
  <div id="nbtns"></div>
  <div id="eq"></div>
  <div id="verdict" class="verdict ok"></div>
  <canvas id="strip"></canvas>
  <div class="stat"><span>Orbit radius</span><span id="sR"></span></div>
  <div class="stat"><span>de Broglie λ</span><span id="sL"></span></div>
  <div class="stat"><span>Electron speed</span><span id="sV"></span></div>
  <div class="stat"><span>Energy</span><span id="sE"></span></div>
  <p id="fact"></p>
</div>

<div id="testbox" class="glass">
  <span>Waves around orbit</span>
  <input type="range" id="kslider" min="1" max="5" step="0.1" value="2.5">
  <b id="kval">2.5</b>
</div>

<div id="bar" class="glass">
  <button class="pill primary" id="playBtn">⏸ Pause</button>
  <button class="pill" id="resetBtn">↺ Reset</button>
  <div class="speed"><span class="l">Speed</span><input type="range" id="spd" min="1" max="10" step="1" value="5"><b id="spdVal">5</b></div>
  <button class="pill on" id="elBtn">● Electron</button>
  <button class="pill" id="testBtn">⚠ Test λ</button>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('C'), ct = cv.getContext('2d'), sv = $('strip'), sc = sv.getContext('2d');
let W = 1, H = 1, dpr = 1;

/* ───────── state ───────── */
let n = 1, playing = true, speed = 5, showElectron = true, testMode = false, testK = 2.5;
let thetaE = 0, tw = 0, trail = [], lastT = performance.now();

/* Bohr-model numbers (real values, orbit sizes on screen are not to scale) */
const A0 = 0.529177, TWO_PI = Math.PI * 2;
const bohr = k => ({ r: k * k * A0, lam: TWO_PI * A0 * k, v: 2.188 / k, E: -13.606 / (k * k) });

const FACTS = [
  'Ground state. One full wavelength wraps the smallest orbit — the fastest electron with the lowest energy.',
  'First excited state. Two wavelengths fit. The orbit is 4× larger and the electron moves at half the speed.',
  'Three wavelengths. Nodes and antinodes stay fixed in place — the signature of a standing wave.',
  'Four wavelengths around a bigger orbit. λ grows with n because the electron slows down (λ = h/mv).',
  'Five wavelengths. A slower electron has a longer wavelength, so more of them fit as the orbit expands.',
];

/* ───────── layout ───────── */
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ct.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = sv.clientWidth; if (w) { sv.width = w * dpr; sv.height = 84 * dpr; sc.setTransform(dpr, 0, 0, dpr, 0, 0); }
}
function layout() {
  const wide = W > 860, availW = wide ? W - 360 : W, top = 76, bot = wide ? 100 : 270;
  const availH = H - top - bot, R = Math.min(availW / 2, availH / 2) * 0.93;
  return { cx: availW / 2 + (wide ? 10 : 0), cy: top + availH / 2, base: R / 5.9 };
}

/* ───────── stars (fixed) ───────── */
const stars = Array.from({ length: 140 }, (_, i) => ({ x: (Math.sin(i * 137.5) * .5 + .5), y: (Math.cos(i * 97.3) * .5 + .5), r: .4 + (i % 3) * .35, a: .15 + (i % 5) * .06 }));

/* ───────── drawing helpers ───────── */
function glow(x, y, r, rgb, a) {
  const g = ct.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ct.fillStyle = g; ct.beginPath(); ct.arc(x, y, r, 0, TWO_PI); ct.fill();
}
function txt(s, x, y, size, col, align = 'center', weight = 600) {
  ct.font = `${weight} ${size}px Syne, sans-serif`; ct.fillStyle = col; ct.textAlign = align; ct.textBaseline = 'middle'; ct.fillText(s, x, y);
}

function drawBg(L) {
  ct.fillStyle = '#080808'; ct.fillRect(0, 0, W, H);
  glow(L.cx, L.cy, L.base * 6.5, '70,100,170', .10);
  stars.forEach(s => { ct.fillStyle = `rgba(255,255,255,${s.a})`; ct.beginPath(); ct.arc(s.x * W, s.y * H, s.r, 0, TWO_PI); ct.fill(); });
}

function drawNucleus(L) {
  const { cx, cy, base } = L, u = base * 0.11;
  glow(cx, cy, base * .8, '255,255,255', .14); glow(cx, cy, base * .4, '140,180,255', .3);
  const t = performance.now() / 4000;
  const pts = [[0, 0], [1.4, .5], [-1.2, .9], [.4, -1.5], [-.7, -1.2], [1.1, -1.1], [-1.6, -.2]];
  pts.forEach(([x, y], i) => {
    const rx = x * Math.cos(t) - y * Math.sin(t), ry = x * Math.sin(t) + y * Math.cos(t);
    ct.beginPath(); ct.arc(cx + rx * u, cy + ry * u, u * 1.35, 0, TWO_PI);
    ct.fillStyle = i % 2 ? 'rgba(111,160,255,.95)' : 'rgba(245,245,245,.95)'; ct.fill();
  });
}

function drawRings(L) {
  for (let i = 1; i <= 5; i++) {
    const r = L.base * i, act = i === n;
    ct.beginPath(); ct.arc(L.cx, L.cy, r, 0, TWO_PI);
    ct.setLineDash(act ? [] : [3, 7]); ct.strokeStyle = act ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.07)'; ct.lineWidth = 1; ct.stroke(); ct.setLineDash([]);
    txt('n=' + i, L.cx, L.cy - r - 9, Math.max(10, L.base * .2), act ? 'rgba(111,160,255,.95)' : 'rgba(255,255,255,.25)');
  }
}

/* standing wave: radius(θ) = r + A·cos(kθ)·cos(ωt) */
function drawWave(L, k) {
  const r = L.base * n, A = r * 0.14, S = 480, cosw = Math.cos(tw);
  const path = f => { ct.beginPath(); for (let s = 0; s <= S; s++) { const th = s / S * TWO_PI, rr = r + f(th); const x = L.cx + rr * Math.cos(th), y = L.cy + rr * Math.sin(th); s ? ct.lineTo(x, y) : ct.moveTo(x, y); } };

  // envelope (extreme positions of the standing wave)
  ct.setLineDash([3, 6]); ct.strokeStyle = 'rgba(255,255,255,.12)'; ct.lineWidth = 1;
  path(th => A * Math.cos(k * th)); ct.stroke(); path(th => -A * Math.cos(k * th)); ct.stroke(); ct.setLineDash([]);

  // soft fill + glow + crisp line
  const f = th => A * Math.cos(k * th) * cosw;
  path(f); ct.strokeStyle = 'rgba(111,160,255,.16)'; ct.lineWidth = 9; ct.lineJoin = 'round'; ct.stroke();
  path(f); ct.strokeStyle = 'rgba(111,160,255,.35)'; ct.lineWidth = 4; ct.stroke();
  path(f); ct.strokeStyle = '#ffffff'; ct.lineWidth = 2; ct.stroke();

  // nodes (cos(kθ) = 0)
  for (let j = 0; ; j++) {
    const th = (Math.PI / 2 + j * Math.PI) / k; if (th >= TWO_PI) break;
    ct.beginPath(); ct.arc(L.cx + r * Math.cos(th), L.cy + r * Math.sin(th), 3, 0, TWO_PI);
    ct.fillStyle = 'rgba(255,255,255,.9)'; ct.fill();
  }

  // seam where the wave fails to close (non-integer k)
  const gap = A * (Math.cos(0) - Math.cos(k * TWO_PI)) * cosw;
  if (Math.abs(gap) > A * 0.03) {
    const x1 = L.cx + r + A * cosw, x2 = L.cx + r + A * Math.cos(k * TWO_PI) * cosw, y = L.cy;
    ct.strokeStyle = 'rgba(255,107,107,.95)'; ct.lineWidth = 2.5; ct.beginPath(); ct.moveTo(x1, y); ct.lineTo(x2, y); ct.stroke();
    glow(x1, y, 22, '255,107,107', .35); glow(x2, y, 22, '255,107,107', .35);
    txt('mismatch', L.cx + r + A + 16, L.cy - 14, Math.max(10, L.base * .2), 'rgba(255,107,107,.9)', 'left');
  }
}

function drawElectron(L) {
  const r = L.base * n, ex = L.cx + r * Math.cos(thetaE), ey = L.cy + r * Math.sin(thetaE);
  trail.push({ x: ex, y: ey }); if (trail.length > 90) trail.shift();
  trail.forEach((p, i) => { const f = i / trail.length; ct.beginPath(); ct.arc(p.x, p.y, 1 + f * 3.2, 0, TWO_PI); ct.fillStyle = `rgba(138,180,255,${f * f * .55})`; ct.fill(); });
  glow(ex, ey, 34, '111,160,255', .35); glow(ex, ey, 16, '255,255,255', .35);
  ct.beginPath(); ct.arc(ex, ey, 6.5, 0, TWO_PI); ct.fillStyle = '#fff'; ct.fill();
  ct.beginPath(); ct.arc(ex, ey, 3, 0, TWO_PI); ct.fillStyle = '#6fa0ff'; ct.fill();
  txt('e⁻', ex + 16, ey - 14, 13, 'rgba(255,255,255,.85)', 'left');
}

/* unrolled wave in the panel: orbit cut open at θ = 0 */
function drawStrip(k) {
  const w = sv.clientWidth; if (!w) return;
  const h = 84, pad = 14, mid = h / 2, A = h * .32, X = th => pad + th / TWO_PI * (w - pad * 2), cosw = Math.cos(tw);
  sc.clearRect(0, 0, w, h);
  sc.strokeStyle = 'rgba(255,255,255,.1)'; sc.lineWidth = 1; sc.beginPath(); sc.moveTo(pad, mid); sc.lineTo(w - pad, mid); sc.stroke();
  sc.setLineDash([3, 5]); [-1, 1].forEach(sg => { sc.beginPath(); for (let i = 0; i <= 200; i++) { const th = i / 200 * TWO_PI, y = mid - sg * A * Math.cos(k * th); i ? sc.lineTo(X(th), y) : sc.moveTo(X(th), y); } sc.stroke(); });
  sc.strokeStyle = 'rgba(255,255,255,.18)';
  [pad, w - pad].forEach(x => { sc.beginPath(); sc.moveTo(x, 8); sc.lineTo(x, h - 8); sc.stroke(); }); sc.setLineDash([]);
  sc.beginPath(); for (let i = 0; i <= 200; i++) { const th = i / 200 * TWO_PI, y = mid - A * Math.cos(k * th) * cosw; i ? sc.lineTo(X(th), y) : sc.moveTo(X(th), y); }
  sc.strokeStyle = '#6fa0ff'; sc.lineWidth = 2; sc.stroke();
  const eth = ((thetaE % TWO_PI) + TWO_PI) % TWO_PI;
  sc.fillStyle = '#fff'; sc.beginPath(); sc.arc(X(eth), mid, 4, 0, TWO_PI); sc.fill();
  sc.font = '600 9px Syne, sans-serif'; sc.fillStyle = 'rgba(255,255,255,.35)'; sc.textAlign = 'left'; sc.fillText('θ = 0', pad + 3, h - 4); sc.textAlign = 'right'; sc.fillText('2π', w - pad - 3, h - 4);
}

/* ───────── UI sync ───────── */
function updateReadouts() {
  const b = bohr(n), k = testMode ? testK : n, closes = Math.abs(k - Math.round(k)) < 0.001;
  $('eq').innerHTML = testMode ? `2πr = <em>${k.toFixed(1)}</em>λ` : `2πr = <em>${n}</em>λ`;
  const v = $('verdict'); v.className = 'verdict ' + (closes ? 'ok' : 'bad');
  v.textContent = closes ? '✓ Allowed — wave closes on itself' : '✗ Not allowed — waves cancel out';
  $('sR').textContent = b.r.toFixed(2) + ' Å';
  $('sL').textContent = b.lam.toFixed(2) + ' Å';
  $('sV').textContent = b.v.toFixed(2) + ' ×10⁶ m/s';
  $('sE').textContent = b.E.toFixed(2) + ' eV';
  $('fact').textContent = testMode ? 'A wave that does not fit a whole number of times interferes with itself on every lap, so the electron cannot stay in that orbit.' : FACTS[n - 1];
}
function setOrbit(k) { n = k; trail = []; thetaE = 0; document.querySelectorAll('.nb').forEach((b, i) => b.classList.toggle('active', i === k - 1)); updateReadouts(); }

for (let i = 1; i <= 5; i++) { const b = document.createElement('button'); b.className = 'nb' + (i === 1 ? ' active' : ''); b.textContent = i; b.onclick = () => setOrbit(i); $('nbtns').appendChild(b); }
$('playBtn').onclick = () => { playing = !playing; $('playBtn').textContent = playing ? '⏸ Pause' : '▶ Play'; };
$('resetBtn').onclick = () => { thetaE = 0; tw = 0; trail = []; };
$('spd').oninput = e => { speed = +e.target.value; $('spdVal').textContent = speed; };
$('elBtn').onclick = () => { showElectron = !showElectron; trail = []; $('elBtn').classList.toggle('on', showElectron); };
$('testBtn').onclick = () => { testMode = !testMode; $('testBtn').classList.toggle('on', testMode); $('testbox').classList.toggle('show', testMode); updateReadouts(); };
$('kslider').oninput = e => { testK = +e.target.value; $('kval').textContent = testK.toFixed(1); updateReadouts(); };

/* ───────── loop ───────── */
function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  if (playing) { tw += dt * speed * 0.9; thetaE += dt * speed * 0.22 / n; }
  const L = layout(), k = testMode ? testK : n;
  drawBg(L); drawRings(L); drawNucleus(L); drawWave(L, k);
  if (showElectron) drawElectron(L);
  drawStrip(k);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); updateReadouts(); requestAnimationFrame(frame);
</script>
</body>
</html>
