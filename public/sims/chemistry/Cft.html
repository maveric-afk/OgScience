<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Field Theory · OgScience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  :root {
    --bg: #080808;
    --text: #e8e8e8;
    --muted: rgba(255,255,255,0.45);
    --line: rgba(255,255,255,0.10);
    --glass: rgba(255,255,255,0.04);
    --blue: #6fa0ff;
    --blue-soft: rgba(111,160,255,0.18);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: 'DM Sans', sans-serif; touch-action: none; }
  #canvas-container { position: fixed; inset: 0; }
  .syne { font-family: 'Syne', sans-serif; }

  /* subtle film grain + vignette, same as main site */
  .noise { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 40%, rgba(0,0,0,0.65) 100%); }

  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }

  /* ── top bar ── */
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: 68px; padding: 0 clamp(16px,3vw,40px); display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  #topbar > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
  .brand .dot { width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #080808; display: grid; place-items: center; font-family: 'Syne'; font-weight: 800; font-size: 14px; }
  .brand span { font-family: 'Syne'; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .back { font-family: 'Syne'; font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--text); text-decoration: none; padding: 10px 22px; border: 1px solid rgba(255,255,255,0.2); border-radius: 100px; transition: all .3s; }
  .back:hover { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.06); }

  /* ── title card ── */
  #title-card { position: fixed; left: clamp(16px,3vw,40px); top: 92px; z-index: 10; max-width: 340px; padding: 24px 26px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #999; padding: 6px 14px; border: 1px solid var(--line); border-radius: 100px; margin-bottom: 16px; }
  #title-card h1 { font-family: 'Syne'; font-weight: 800; font-size: clamp(24px,2.6vw,34px); line-height: 1.05; letter-spacing: -0.025em; margin-bottom: 12px; }
  .grad { background: linear-gradient(135deg,#fff 0%,#8a8a8a 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #title-card p { font-size: 13px; line-height: 1.7; color: var(--muted); }
  #title-card p b { color: #fff; font-weight: 500; }
  #title-card p .eg { color: var(--blue); font-weight: 500; }

  /* ── orbital panel ── */
  #panel { position: fixed; right: clamp(16px,3vw,40px); top: 92px; z-index: 10; width: 236px; padding: 22px; display: flex; flex-direction: column; gap: 6px; }
  .group-title { display: flex; align-items: center; justify-content: space-between; font-family: 'Syne'; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 6px 2px 8px; }
  .group-title small { font-family: 'DM Sans'; font-weight: 400; letter-spacing: .04em; text-transform: none; font-size: 11px; opacity: .7; }
  .orb-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 16px; margin-bottom: 8px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,0.02); color: var(--text); font-family: 'Syne'; font-weight: 700; font-size: 16px; cursor: pointer; transition: all .3s cubic-bezier(.16,1,.3,1); }
  .orb-btn .sw { width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: .35; transition: all .3s; }
  .orb-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.28); transform: translateX(-3px); }
  .orb-btn.t2g.active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.7); box-shadow: 0 0 24px rgba(255,255,255,0.15); }
  .orb-btn.t2g.active .sw { opacity: 1; box-shadow: 0 0 10px #fff; }
  .orb-btn.eg .sw { background: var(--blue); }
  .orb-btn.eg.active { background: var(--blue-soft); border-color: var(--blue); box-shadow: 0 0 24px rgba(111,160,255,0.3); }
  .orb-btn.eg.active .sw { opacity: 1; box-shadow: 0 0 10px var(--blue); }
  .row { display: flex; gap: 8px; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  .mini { flex: 1; padding: 10px 6px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: var(--text); font-family: 'Syne'; font-weight: 600; font-size: 12px; letter-spacing: .03em; cursor: pointer; transition: all .25s; }
  .mini:hover { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.06); }
  .mini.primary { background: #fff; color: #080808; border-color: #fff; }
  .mini.primary:hover { box-shadow: 0 8px 28px rgba(255,255,255,0.2); }

  /* ── energy diagram ── */
  #energy { position: fixed; left: clamp(16px,3vw,40px); bottom: 56px; z-index: 10; width: 260px; padding: 18px 20px 14px; }
  #energy .cap { font-family: 'Syne'; font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  #energy svg { width: 100%; height: auto; display: block; overflow: visible; }
  .lvl { stroke: rgba(255,255,255,0.22); stroke-width: 3; stroke-linecap: round; transition: all .4s; }
  .lvl.eg.on { stroke: var(--blue); filter: drop-shadow(0 0 6px var(--blue)); }
  .lvl.t2g.on { stroke: #fff; filter: drop-shadow(0 0 6px #fff); }
  .dlabel { font-family: 'Syne'; font-weight: 700; font-size: 11px; fill: rgba(255,255,255,0.55); }
  .dlabel.blue { fill: var(--blue); }

  #hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; z-index: 10; pointer-events: none; font-size: 12px; letter-spacing: .06em; color: rgba(255,255,255,0.35); }

  @media (max-width: 820px) {
    #title-card { display: none; }
    #energy { display: none; }
    #panel { top: auto; bottom: 40px; left: 12px; right: 12px; width: auto; padding: 14px; flex-direction: row; flex-wrap: wrap; gap: 8px; }
    .group-title { display: none; }
    .orb-btn { width: calc(33.3% - 6px); margin: 0; padding: 12px 10px; font-size: 14px; }
    .row { width: 100%; border: 0; padding-top: 4px; margin: 0; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div class="vignette"></div>
<div class="noise"></div>

<div id="topbar">
  <a class="brand" href="/"><div class="dot">O</div><span>OgScience</span></a>
  <a class="back" href="/simulations">← Simulations</a>
</div>


<div id="panel" class="glass">
  <div class="group-title"><span>t<sub>2g</sub></span><small>between ligands</small></div>
  <div id="grp-t2g"></div>
  <div class="group-title"><span>e<sub>g</sub></span><small>toward ligands</small></div>
  <div id="grp-eg"></div>
  <div class="row">
    <button class="mini primary" id="btn-all">Show all</button>
    <button class="mini" id="btn-clear">Clear</button>
    <button class="mini" id="btn-rot">Spin: On</button>
  </div>
</div>

<div id="energy" class="glass">
  <div class="cap">Energy Level Diagram</div>
  <svg viewBox="0 0 220 170">
    <!-- barycentre -->
    <line x1="20" y1="88" x2="200" y2="88" stroke="rgba(255,255,255,0.12)" stroke-dasharray="3 5"/>
    <!-- eg level -->
    <line id="lvl-dz2"   class="lvl eg"  x1="70"  y1="28" x2="105" y2="28"/>
    <line id="lvl-dx2y2" class="lvl eg"  x1="115" y1="28" x2="150" y2="28"/>
    <text class="dlabel blue" x="170" y="32">e<tspan font-size="8" dy="3">g</tspan></text>
    <!-- t2g level -->
    <line id="lvl-dxy" class="lvl t2g" x1="52"  y1="142" x2="82"  y2="142"/>
    <line id="lvl-dyz" class="lvl t2g" x1="95"  y1="142" x2="125" y2="142"/>
    <line id="lvl-dzx" class="lvl t2g" x1="138" y1="142" x2="168" y2="142"/>
    <text class="dlabel" x="180" y="146">t<tspan font-size="8" dy="3">2g</tspan></text>
    <!-- Delta arrow -->
    <line x1="30" y1="34" x2="30" y2="136" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <path d="M26 42 L30 34 L34 42 M26 128 L30 136 L34 128" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text class="dlabel" x="38" y="92" style="fill:rgba(255,255,255,0.8)">Δ<tspan font-size="8" dy="3">o</tspan></text>
  </svg>
</div>

<div id="hint">Drag to rotate · Scroll or pinch to zoom · Tap orbitals to toggle</div>

<script>
/* ───────────── DATA ───────────── */
const CUBE = 4, B = CUBE / 2;
const BLUE = 0x6fa0ff, WHITE = 0xf2f2f2;

const ORBITALS = {
  dxy:   { label: 'd<sub>xy</sub>',      grp: 't2g', color: WHITE, r: 0.35, targets: [[B,B,0],[-B,B,0],[B,-B,0],[-B,-B,0]] },
  dyz:   { label: 'd<sub>yz</sub>',      grp: 't2g', color: WHITE, r: 0.35, targets: [[0,B,B],[0,-B,B],[0,B,-B],[0,-B,-B]] },
  dzx:   { label: 'd<sub>zx</sub>',      grp: 't2g', color: WHITE, r: 0.35, targets: [[B,0,B],[-B,0,B],[B,0,-B],[-B,0,-B]] },
  dx2y2: { label: 'd<sub>x²−y²</sub>',   grp: 'eg',  color: BLUE,  r: 0.40, targets: [[B,0,0],[-B,0,0],[0,B,0],[0,-B,0]] },
  dz2:   { label: 'd<sub>z²</sub>',      grp: 'eg',  color: BLUE,  r: 0.40, targets: [[0,0,B],[0,0,-B]], ring: true },
};
const groups = {};

let scene, camera, renderer, controls;

/* ───────────── INIT ───────────── */
window.onload = () => { buildUI(); init(); animate(); };

function buildUI() {
  Object.entries(ORBITALS).forEach(([key, o]) => {
    const b = document.createElement('button');
    b.className = 'orb-btn ' + o.grp; b.id = 'btn-' + key;
    b.innerHTML = `<span>${o.label}</span><span class="sw"></span>`;
    b.onclick = () => toggle(key);
    document.getElementById('grp-' + o.grp).appendChild(b);
  });
  document.getElementById('btn-all').onclick = () => Object.keys(ORBITALS).forEach(k => setVisible(k, true));
  document.getElementById('btn-clear').onclick = () => Object.keys(ORBITALS).forEach(k => setVisible(k, false));
  document.getElementById('btn-rot').onclick = () => { controls.autoRotate = !controls.autoRotate; syncRot(); };
}
function syncRot() { document.getElementById('btn-rot').textContent = 'Spin: ' + (controls.autoRotate ? 'On' : 'Off'); }

function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x080808, 0.045);

  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(7, 4.5, 9);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.05;
  controls.autoRotate = true; controls.autoRotateSpeed = 0.9;
  controls.minDistance = 5; controls.maxDistance = 22;
  controls.addEventListener('start', () => { controls.autoRotate = false; syncRot(); });

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const d1 = new THREE.DirectionalLight(0xffffff, 0.9); d1.position.set(8, 10, 8); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x4488ff, 0.7); d2.position.set(-8, -4, 6); scene.add(d2);

  buildStars(); buildCube(); buildAxes(); buildCore(); buildOrbitals();
  addEventListener('resize', onResize);
}

/* ───────────── SCENE PIECES ───────────── */
function buildStars() {
  const n = 700, p = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) p[i] = (Math.random() - 0.5) * 60;
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x777777, size: 0.04, transparent: true, opacity: 0.6, fog: false })));
}

function buildCube() {
  const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(CUBE, CUBE, CUBE));
  scene.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })));
  // faint glass faces
  scene.add(new THREE.Mesh(new THREE.BoxGeometry(CUBE, CUBE, CUBE),
    new THREE.MeshBasicMaterial({ color: 0x6fa0ff, transparent: true, opacity: 0.025, side: THREE.DoubleSide, depthWrite: false })));
}

function label(text, color, pos) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.font = '800 76px Syne, sans-serif'; x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 64, 66);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  s.position.copy(pos); s.scale.set(1, 1, 1); return s;
}

function buildAxes() {
  const L = 3.5;
  [[new THREE.Vector3(1,0,0),'#ffffff','X'],[new THREE.Vector3(0,1,0),'#ffffff','Y'],[new THREE.Vector3(0,0,1),'#ffffff','Z']].forEach(([d, col, t]) => {
    const pts = [d.clone().multiplyScalar(-L), d.clone().multiplyScalar(L)];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22 })));
    scene.add(label(t, 'rgba(255,255,255,0.7)', d.clone().multiplyScalar(L + 0.45)));
  });
}

// metal ion at the centre + six ligands at the face centres (octahedral)
function buildCore() {
  const ion = new THREE.Mesh(new THREE.SphereGeometry(0.16, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  scene.add(ion);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.06, depthWrite: false }));
  scene.add(halo);
  [[B,0,0],[-B,0,0],[0,B,0],[0,-B,0],[0,0,B],[0,0,-B]].forEach(p => {
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 24), new THREE.MeshPhysicalMaterial({ color: 0x1c2740, emissive: 0x2a4a8a, emissiveIntensity: 0.6, roughness: 0.3, clearcoat: 1 }));
    l.position.set(...p); scene.add(l);
    const g = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 24), new THREE.MeshBasicMaterial({ color: BLUE, transparent: true, opacity: 0.07, depthWrite: false }));
    g.position.set(...p); scene.add(g);
  });
}

function lobe(radius, color, t) {
  const target = new THREE.Vector3(...t), len = target.length();
  const pivot = new THREE.Object3D();
  const mat = new THREE.MeshPhysicalMaterial({ color, emissive: color, emissiveIntensity: 0.28, metalness: 0.1, roughness: 0.25, transparent: true, opacity: 0.82, clearcoat: 1, clearcoatRoughness: 0.1 });
  const m = new THREE.Mesh(new THREE.SphereGeometry(radius, 40, 40), mat);
  m.scale.set(1, 1, len / (2 * radius));   // stretch along local Z
  m.position.z = len / 2;                   // base at origin, tip at target
  pivot.add(m);
  pivot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), target.clone().normalize());
  // soft outer glow
  const glow = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.5, 24, 24), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.06, depthWrite: false }));
  glow.scale.copy(m.scale); glow.position.copy(m.position); pivot.add(glow);
  return pivot;
}

function tip(t, color) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshBasicMaterial({ color }));
  s.position.set(...t); return s;
}

function buildOrbitals() {
  Object.entries(ORBITALS).forEach(([key, o]) => {
    const g = new THREE.Group();
    o.targets.forEach(t => { g.add(lobe(o.r, o.color, t)); g.add(tip(t, o.color)); });
    if (o.ring) {
      g.add(new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.18, 24, 72),
        new THREE.MeshPhysicalMaterial({ color: o.color, emissive: o.color, emissiveIntensity: 0.28, transparent: true, opacity: 0.82, clearcoat: 1 })));
    }
    g.visible = false; g.scale.setScalar(0.001); g.userData.on = false;
    scene.add(g); groups[key] = g;
  });
}

/* ───────────── INTERACTION ───────────── */
function setVisible(key, on) {
  groups[key].userData.on = on;
  if (on) groups[key].visible = true;
  document.getElementById('btn-' + key).classList.toggle('active', on);
  document.getElementById('lvl-' + key).classList.toggle('on', on);
}
function toggle(key) { setVisible(key, !groups[key].userData.on); }

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  Object.values(groups).forEach(g => {            // smooth grow / shrink
    const goal = g.userData.on ? 1 : 0.001, s = g.scale.x + (goal - g.scale.x) * 0.14;
    g.scale.setScalar(s);
    if (!g.userData.on && s < 0.02) g.visible = false;
  });
  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
